name: CICD

# Security model (see docs/release-readiness.md):
# - Every job declares its own minimal token permissions; the default is none.
# - Third-party actions are pinned to full commit SHAs; the comment names the
#   release tag the SHA was resolved from.
# - Release artifacts are built exactly once, verified, hashed, and the same
#   files are tested on every supported Python and uploaded to PyPI.
# - Publication uses PyPI Trusted Publishing (OIDC) only. It stays disabled until
#   the documented prerequisites are configured and verified; the release gate
#   fails closed otherwise. No long-lived PyPI credentials are referenced.

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  release:
    types: [ published ]

permissions: {}

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_dev.txt
      - name: Run Tests
        run: make test

  code-scan:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  release-tooling:
    name: Release Tooling Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install hash-locked check tools
        run: python -m pip install --require-hashes --no-deps -r ci/release/requirements/check.txt
      - name: Test release workflow policy and readiness scripts
        run: python -m pytest -p no:cacheprovider -vv ci/release/tests

  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sums-sha256: ${{ steps.hash.outputs.sums-sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install hash-locked build tools
        run: python -m pip install --require-hashes --no-deps -r ci/release/requirements/build.txt
      - name: Build sdist and wheel once
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python -m build --no-isolation --outdir dist .
      - name: Verify artifact metadata and record hashes
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -- dist --requirements requirements.txt --write-sums dist/SHA256SUMS
          if [ "$EVENT_NAME" = "release" ]; then
            set -- "$@" --expected-tag "$RELEASE_TAG"
          fi
          python ci/release/verify_dist.py "$@"
          cat dist/SHA256SUMS
      - name: Export hash-file digest
        id: hash
        run: echo "sums-sha256=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload verified artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  verify-artifacts:
    name: Verify Built Artifacts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    env:
      SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Confirm artifacts are the ones the build job hashed
        run: |
          echo "${SUMS_SHA256}  dist/SHA256SUMS" | sha256sum --check --strict
          (cd dist && sha256sum --check --strict SHA256SUMS)
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/python" -m pip install --require-hashes --no-deps -r ci/release/requirements/check.txt
          "$RUNNER_TEMP/tools/bin/python" ci/release/verify_dist.py dist --requirements requirements.txt --check-sums dist/SHA256SUMS
      - name: Install the wheel (with its optional extra) into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/artifact"
          WHEEL="$(echo dist/*.whl)"
          "$RUNNER_TEMP/artifact/bin/python" -m pip install "${WHEEL}[alicloud]"
          "$RUNNER_TEMP/artifact/bin/python" -m pip check
          "$RUNNER_TEMP/artifact/bin/python" -m pip freeze --exclude gimme-aws-creds > "$RUNNER_TEMP/resolved.txt"
          cat "$RUNNER_TEMP/resolved.txt"
      - name: Check the installed package comes from the wheel
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/artifact/bin/python" -I -c '
          import sys, gimme_aws_creds.main, gimme_aws_creds
          path = gimme_aws_creds.__file__
          assert path.startswith(sys.prefix), path
          print("imported", path)
          '
      - name: Audit the resolved dependency set
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/python" -m pip install --require-hashes --no-deps -r ci/release/requirements/audit.txt
          "$RUNNER_TEMP/audit/bin/pip-audit" --strict --progress-spinner off --no-deps --disable-pip -r "$RUNNER_TEMP/resolved.txt"
      - name: Reject over-long Content-Encoding chains (loopback fixture)
        run: '"$RUNNER_TEMP/artifact/bin/python" -I ci/release/check_encoding_chain.py'
      - name: Run unit tests against the installed wheel
        # Source layout checks run in the test job. The OS keyring round-trip is
        # deselected because this job pins the null keyring backend.
        run: |
          "$RUNNER_TEMP/artifact/bin/python" -m pip install --require-hashes --no-deps -r ci/release/requirements/unit.txt
          "$RUNNER_TEMP/artifact/bin/python" -m pip check
          mkdir -p "$RUNNER_TEMP/unit" "$RUNNER_TEMP/home"
          cp -R tests "$RUNNER_TEMP/unit/tests"
          cd "$RUNNER_TEMP/unit"
          HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/artifact/bin/python" -m pytest -p no:cacheprovider -q tests \
            --ignore=tests/test_build_verification.py \
            --deselect tests/test_cli_first_run.py::TestSourceEntryPointFirstRun \
            --deselect tests/test_keyring_integration.py::TestKeyringAPIs::test_keyring_password_operations

  release-gate:
    name: Release Readiness Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs:
      - test
      - code-scan
      - release-tooling
      - build
      - verify-artifacts
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the release commit to be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
      - name: Require verified Trusted Publishing prerequisites
        env:
          PYPI_PUBLISH_ENABLED: ${{ vars.PYPI_PUBLISH_ENABLED }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUBLISH_ENVIRONMENT: pypi
          ALLOWED_TAG_POLICIES: v*
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I ci/release/check_publish_readiness.py

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs:
      - build
      - release-gate
    environment:
      name: pypi
      url: https://pypi.org/project/gimme-aws-creds/
    permissions:
      id-token: write
    env:
      SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: verified
      - name: Upload only the hashed, tested files
        run: |
          echo "${SUMS_SHA256}  verified/SHA256SUMS" | sha256sum --check --strict
          (cd verified && sha256sum --check --strict SHA256SUMS)
          mkdir dist
          cut -d' ' -f3 verified/SHA256SUMS | while read -r name; do cp "verified/$name" dist/; done
          ls -l dist
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
          print-hash: true
